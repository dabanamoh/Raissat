# RAISSAT content manager configuration (Decap CMS).
# Docs: https://decapcms.org/docs/configuration-options/

backend:
  name: github
  repo: dabanamoh/Raissat
  branch: main
  # The site's own domain. Login is handled by /api/auth and /api/callback
  # (see api/ folder), so this must be the origin those functions run on.
  base_url: https://raissat.org
  auth_endpoint: api/auth
  commit_messages:
    create: "Content: create {{collection}} “{{slug}}”"
    update: "Content: update {{collection}} “{{slug}}”"
    delete: "Content: delete {{collection}} “{{slug}}”"
    uploadMedia: "Content: upload “{{path}}”"
    deleteMedia: "Content: delete “{{path}}”"

# Set to true and run `npm run cms` to edit locally without GitHub login.
local_backend: true

# Drafts, review and publish instead of saving straight to the live site.
publish_mode: editorial_workflow

site_url: https://raissat.org
display_url: https://raissat.org
logo_url: /assets/logo.svg

media_folder: public/uploads
public_folder: /uploads

slug:
  encoding: unicode
  clean_accents: true

collections:
  # ---------------------------------------------------------------- Articles
  - name: articles
    label: Articles
    label_singular: Article
    description: Articles, news and resources shown in the Media Center.
    folder: src/content/articles
    create: true
    extension: json
    format: json
    slug: "{{slug}}"
    identifier_field: title
    summary: "{{title}} — {{date | date('D MMM YYYY')}}"
    sortable_fields: [date, title, category]
    editor:
      preview: false
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Publish date, name: date, widget: datetime, format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false }
      - { label: Type, name: category, widget: select, options: [Article, News, Resource], default: Article }
      - { label: Draft (hide from the site), name: draft, widget: boolean, default: false, required: false }
      - { label: Author, name: author, widget: string }
      - { label: Author photo, name: authorImage, widget: image, required: false, hint: "Optional. Square photo works best." }
      - { label: Cover image, name: thumbnail, widget: image, hint: "Landscape, at least 1280×720. Shown on cards and at the top of the article." }
      - { label: Short summary, name: excerpt, widget: text, hint: "One or two sentences shown on the card and used for search results and social previews." }
      - { label: Body, name: body, widget: markdown }
      - label: Figures
        name: images
        widget: list
        required: false
        field: { label: Image, name: image, widget: image }
        hint: "Optional images shown after the body text."
      - { label: Figure caption, name: imageCaption, widget: text, required: false }
      - { label: Closing text, name: conclusion, widget: markdown, required: false, hint: "Shown after the figures." }
      - { label: Publisher / journal, name: publisher, widget: string, required: false }
      - { label: Link to the paper (DOI or URL), name: reference, widget: string, required: false }

  # -------------------------------------------------------------------- Team
  - name: team
    label: Team
    label_singular: Team member
    description: People shown on the Who We Are page, in the order set here.
    folder: src/content/team
    create: true
    extension: json
    format: json
    slug: "{{slug}}"
    identifier_field: name
    summary: "{{order}}. {{name}} — {{role}}"
    sortable_fields: [order, name]
    editor:
      preview: false
    fields:
      - { label: Display order, name: order, widget: number, value_type: int, min: 1, hint: "1 appears first." }
      - { label: Full name, name: name, widget: string, hint: "First name is shown in capitals automatically." }
      - { label: Role / title, name: role, widget: string }
      - { label: Photo, name: image, widget: image, hint: "Portrait orientation, at least 800×1000." }
      - { label: Email, name: email, widget: string, required: false }
      - { label: Short summary, name: summary, widget: text, hint: "Shown on the card. Two to four sentences." }
      - { label: Full biography, name: bio, widget: markdown, hint: "Shown when a visitor opens the profile." }

  # ---------------------------------------------------------------- Services
  - name: services
    label: What We Do
    label_singular: Service
    description: The service areas listed on the What We Do page, each with its own page.
    folder: src/content/services
    create: true
    extension: json
    format: json
    slug: "{{slug}}"
    identifier_field: title
    summary: "{{order}}. {{title}}"
    sortable_fields: [order, title]
    editor:
      preview: false
    fields:
      - { label: Display order, name: order, widget: number, value_type: int, min: 1 }
      - { label: Title, name: title, widget: string }
      - { label: Subtitle, name: subtitle, widget: string }
      - { label: Summary, name: description, widget: text, hint: "Shown on the What We Do listing." }
      - { label: Full description, name: detailedDescription, widget: markdown, hint: "Shown on the service's own page." }
      - label: Photos
        name: images
        widget: list
        field: { label: Image, name: image, widget: image }
        hint: "The first photo is used on the listing; all photos rotate in the carousel on the service page."
      - label: Focus areas
        name: focusAreas
        widget: list
        required: false
        field: { label: Focus area, name: area, widget: string }
      - { label: Button label, name: cta, widget: string, default: "Partner With Us" }

  # ------------------------------------------------------------------- Pages
  - name: pages
    label: Pages
    description: Text on the fixed pages.
    editor:
      preview: false
    files:
      - name: home
        label: Home page
        file: src/content/pages/home.json
        fields:
          - label: Hero
            name: hero
            widget: object
            fields:
              - { label: Background image, name: image, widget: image, hint: "Wide photo, at least 1920×1080." }
              - { label: Headline, name: title, widget: string }
              - { label: Text, name: text, widget: text }
              - { label: Primary button label, name: primaryLabel, widget: string }
              - { label: Primary button link, name: primaryRoute, widget: string, hint: "e.g. /services" }
              - { label: Secondary button label, name: secondaryLabel, widget: string }
              - { label: Secondary button link, name: secondaryRoute, widget: string }
          - label: Who We Are section
            name: who
            widget: object
            fields:
              - { label: Heading, name: title, widget: string }
              - { label: Text, name: text, widget: text }
              - { label: Mission heading, name: missionTitle, widget: string }
              - { label: Mission text, name: missionText, widget: text }
              - { label: Vision heading, name: visionTitle, widget: string }
              - { label: Vision text, name: visionText, widget: text }
              - { label: Button label, name: buttonLabel, widget: string }
              - { label: Button link, name: buttonRoute, widget: string }
          - label: What We Do section
            name: services
            widget: object
            fields:
              - { label: Heading, name: title, widget: string }
              - { label: Intro, name: intro, widget: text }
              - { label: Core services heading, name: coreTitle, widget: string }
              - label: Core services
                name: coreServices
                widget: list
                fields:
                  - { label: Icon, name: icon, widget: image, hint: "SVG or PNG, shown at 40px." }
                  - { label: Title, name: title, widget: string }
                  - { label: Text, name: text, widget: text }
              - { label: Impact heading, name: impactTitle, widget: string }
              - { label: Impact intro, name: impactIntro, widget: text }
              - { label: Approach heading, name: approachTitle, widget: string }
              - label: Approach items
                name: approach
                widget: list
                fields:
                  - { label: Icon, name: icon, widget: image }
                  - { label: Title, name: title, widget: string }
                  - { label: Text, name: text, widget: text }
              - { label: Button label, name: buttonLabel, widget: string }
              - { label: Button link, name: buttonRoute, widget: string }
          - label: FAQ section
            name: faqs
            widget: object
            fields:
              - { label: Heading, name: title, widget: string }
              - { label: Text, name: text, widget: text }
              - { label: Button label, name: buttonLabel, widget: string }
              - { label: How many questions to show, name: count, widget: number, value_type: int, min: 1, max: 12 }

      - name: about
        label: Who We Are page
        file: src/content/pages/about.json
        fields:
          - { label: Page title, name: title, widget: string }
          - { label: Search description, name: metaDescription, widget: text }
          - { label: Introduction, name: intro, widget: markdown }
          - label: Impact philosophy
            name: philosophy
            widget: object
            fields:
              - { label: Heading, name: title, widget: string }
              - { label: Text, name: text, widget: markdown }
              - { label: Pillars intro, name: pillarsIntro, widget: string }
              - label: Pillars
                name: pillars
                widget: list
                fields:
                  - { label: Title, name: title, widget: string }
                  - { label: Text, name: text, widget: string }
          - label: Team section
            name: team
            widget: object
            fields:
              - { label: Heading, name: heading, widget: string }
              - { label: Philosophy title, name: philosophyTitle, widget: string }
              - { label: Philosophy text, name: philosophyText, widget: text }

      - name: services
        label: What We Do page
        file: src/content/pages/services.json
        fields:
          - { label: Page title, name: title, widget: string }
          - { label: Subtitle, name: subtitle, widget: string }
          - { label: Search description, name: metaDescription, widget: text }
          - { label: Introduction, name: intro, widget: text }
          - { label: Read more button label, name: readMoreLabel, widget: string }
          - { label: Focus areas label, name: focusAreasLabel, widget: string }
          - { label: Other services heading, name: othersHeading, widget: string }

      - name: media
        label: Media Center page
        file: src/content/pages/media.json
        fields:
          - { label: Page title, name: title, widget: string }
          - { label: Heading, name: heading, widget: string }
          - { label: Search description, name: metaDescription, widget: text }
          - { label: All tab label, name: allLabel, widget: string }
          - label: Categories
            name: categories
            widget: list
            field: { label: Category, name: category, widget: string }
            hint: "Must match the Type options on articles."
          - { label: Read article label, name: readLabel, widget: string }
          - { label: Related articles heading, name: relatedHeading, widget: string }
          - { label: Back link label, name: backLabel, widget: string }

      - name: contact
        label: Contact page
        file: src/content/pages/contact.json
        fields:
          - { label: Page title, name: title, widget: string }
          - { label: Subtitle, name: subtitle, widget: string }
          - { label: Search description, name: metaDescription, widget: text }
          - { label: Introduction, name: intro, widget: text }
          - { label: Cards heading, name: cardsHeading, widget: string }
          - label: Contact cards
            name: cards
            widget: list
            fields:
              - { label: Inquiry type, name: type, widget: string }
              - { label: Text, name: text, widget: text }
              - { label: Icon, name: icon, widget: select, options: [question, microscope, coins, mail], default: mail }
              - { label: Email for this inquiry, name: email, widget: string, required: false }
              - { label: Button label, name: buttonLabel, widget: string, default: "Contact Us" }
          - { label: Locations heading, name: locationsHeading, widget: string }
          - label: Locations
            name: locations
            widget: list
            fields:
              - { label: Name, name: title, widget: string }
              - { label: Address, name: text, widget: text }
              - { label: Map popup text, name: popup, widget: string }
              - { label: Latitude, name: lat, widget: number, value_type: float, step: 0.00001 }
              - { label: Longitude, name: lng, widget: number, value_type: float, step: 0.00001 }

      - name: faqs
        label: FAQs
        file: src/content/faqs.json
        fields:
          - { label: Page title, name: title, widget: string }
          - { label: Search description, name: metaDescription, widget: text }
          - label: Questions
            name: items
            widget: list
            summary: "{{fields.question}}"
            fields:
              - { label: Question, name: question, widget: string }
              - { label: Answer, name: answer, widget: markdown }

  # ---------------------------------------------------------------- Settings
  - name: settings
    label: Site settings
    description: Branding, navigation, footer, SDG badges and the site-wide call to action.
    editor:
      preview: false
    files:
      - name: site
        label: General
        file: src/content/settings/site.json
        fields:
          - { label: Site name, name: siteName, widget: string }
          - { label: Site URL, name: siteUrl, widget: string, hint: "Used for links in search results and social previews." }
          - { label: Tagline (footer), name: tagline, widget: string }
          - { label: Default search description, name: description, widget: text }
          - { label: Default social preview image, name: ogImage, widget: image }
          - { label: Logo, name: logo, widget: image }
          - { label: Compact logo (tablet and phone), name: logoCompact, widget: image }
          - { label: White logo (footer), name: logoWhite, widget: image }
          - { label: White round logo, name: logoWhiteRound, widget: image }
          - label: Navigation
            name: nav
            widget: list
            fields:
              - { label: Label, name: text, widget: string }
              - { label: Link, name: route, widget: string, hint: "e.g. /about" }
          - label: Navigation button
            name: navButton
            widget: object
            fields:
              - { label: Label, name: label, widget: string }
              - { label: Link, name: route, widget: string }
          - label: Social links
            name: socials
            widget: list
            fields:
              - { label: Network, name: network, widget: select, options: [instagram, linkedin, x] }
              - { label: Accessible label, name: label, widget: string }
              - { label: URL, name: url, widget: string }
          - { label: Contact email, name: contactEmail, widget: string }
          - label: Footer support links
            name: footerSupportLinks
            widget: list
            fields:
              - { label: Label, name: text, widget: string }
              - { label: Link, name: route, widget: string }
          - { label: SDG section heading, name: sdgHeading, widget: string }
          - label: SDG badges
            name: sdgs
            widget: list
            fields:
              - { label: Name, name: label, widget: string }
              - { label: Badge image, name: image, widget: image }
          - label: Site-wide call to action
            name: cta
            widget: object
            fields:
              - { label: Heading, name: title, widget: string }
              - { label: Text, name: text, widget: text }
              - { label: Tagline, name: tagline, widget: string }
              - { label: Button label, name: buttonLabel, widget: string }
              - { label: Button link, name: buttonRoute, widget: string }

      - name: banner
        label: Event banner
        file: src/content/settings/banner.json
        fields:
          - { label: Show the banner, name: enabled, widget: boolean, default: false }
          - { label: Link, name: link, widget: string, required: false }
          - { label: Image description, name: alt, widget: string, required: false }
          - { label: Desktop image, name: imageDesktop, widget: image }
          - { label: Tablet image, name: imageTablet, widget: image, required: false }
          - { label: Phone image, name: imageMobile, widget: image, required: false }
          - { label: Hide automatically after, name: expires, widget: datetime, required: false, format: "YYYY-MM-DDTHH:mm:ss" }
